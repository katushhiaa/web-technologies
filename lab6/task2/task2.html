<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список завдань</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>
<h1>Список завдань</h1>
<form id="taskForm">
    <input type="text" id="taskInput" placeholder="Нове завдання..." required minlength="3" />
    <button type="submit" class="add">Додати</button>
</form>

<div class="sort-controls">
    <label>
        Сортувати:
        <select id="sortSelect">
            <option value="created">За датою створення</option>
            <option value="completed">За станом виконання</option>
            <option value="updated">За датою оновлення</option>
        </select>
    </label>
</div>

<ul class="task-list" id="taskList"></ul>

<script src="task2.js"> </script>
</body>
</html>
