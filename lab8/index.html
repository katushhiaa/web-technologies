<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Memory Game</h1>

<div id="settings">
    <label>Рядки: <input type="number" id="rows" min="2" max="6" value="3"></label>
    <label>Стовпці: <input type="number" id="cols" min="2" max="6" value="4"></label>

    <label>Складність:
        <select id="difficulty">
            <option value="easy">Легка (3 хв)</option>
            <option value="normal">Середня (2 хв)</option>
            <option value="hard">Складна (1 хв)</option>
        </select>
    </label>
    <hr>
    <label>Кількість гравців:
        <select id="players-count">
            <option value="1">1 гравець</option>
            <option value="2">2 гравці</option>
        </select>
    </label>

    <div id="player-names">
        <label>Гравець 1: <input type="text" id="player1" value="Гравець 1"></label>
        <label id="player2-label" style="display: none;">Гравець 2: <input type="text" id="player2" value="Гравець 2"></label>
    </div>

    <label>Кількість раундів: <input type="number" id="rounds" min="1" value="1"></label>


    <button id="start-game">Розпочати гру</button>
    <button id="reset-settings">Скинути налаштування</button>
</div>

<div id="info">
    <p>Таймер: <span id="timer">--:--</span></p>
    <p>Ходи: <span id="moves">0</span></p>
    <p>Хід: <span id="current-player">-</span></p>
</div>


<div id="game-board" class="board"></div>
<button id="restart-btn">Рестарт</button>

<script src="script.js"></script>
</body>

</html>
